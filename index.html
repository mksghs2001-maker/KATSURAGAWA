<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11171b"><title>戦国群雄録 — 八ビットの天下</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><div><span class="eyebrow">RETRO STRATEGY SIMULATION / 1560</span><h1>戦国群雄録<span>八ビットの天下</span></h1></div><div class="seal">天下<br>布武</div></header>
<section class="statusbar" aria-label="勢力情報"><strong>織田家 <span>尾張より天下へ</span></strong><div id="date"></div><div id="power"></div></section>
<div class="layout"><section class="map-panel panel"><div class="panel-title"><h2>畿内・東国絵図</h2><span>国を選んで命令</span></div><div class="map-wrap"><svg id="map" viewBox="0 0 720 450" role="group" aria-label="領地選択地図"></svg><div class="compass">北<br>↑<br>＋</div><div class="sea">東 海</div></div><div class="legend"><span><i class="own"></i>織田領</span><span><i class="enemy"></i>他家領</span><span><i class="active"></i>選択中</span><span id="territories"></span></div></section>
<aside class="panel"><div class="panel-title"><h2>領国情報</h2><span id="ownership"></span></div><div class="province-head"><span id="clan"></span><h3 id="province"></h3><p id="province-note"></p></div><dl id="stats"></dl><div class="orders"><h4>評定 ― 本季の命令 <span id="ap"></span></h4><button data-action="farm"><span>一　開墾</span><small>金30 ／ 石高＋15</small></button><button data-action="recruit"><span>二　徴兵</span><small>金40・糧20 ／ 兵＋30</small></button><button data-action="train"><span>三　調練</span><small>金20 ／ 士気＋15</small></button><button data-action="sell"><span>五　米売却</span><small>糧50 → 金35</small></button><button data-action="buy"><span>六　米購入</span><small>金40 → 糧50</small></button><button data-action="give"><span>七　施し</span><small>糧30 ／ 士気＋20</small></button><button data-action="tax"><span>八　税率</span><small id="tax">40％ ⇄ 60％</small></button><button id="attack"><span>四　出陣</span><small>隣接国を攻める ／ 糧30</small></button></div></aside></div>
<section class="bottom"><div class="panel chronicle"><div class="panel-title"><h2>戦国日誌</h2><span>軍師からの報せ</span></div><ol id="log" aria-live="polite"></ol></div><div class="controls"><button id="next" class="primary">次の季節へ <span>→</span></button><p>季節ごとに命令3回・秋に収穫</p><div class="utility"><button id="save">記録する</button><button id="load">記録を読む</button><button id="help">遊び方</button><button id="reset">初めから</button></div><p id="notice" role="status"></p></div></section>
<footer><span>SENGOKU GUNYUROKU — ORIGINAL BROWSER GAME</span><span>一国から、天下十二国へ。</span></footer></main>
<dialog id="dialog"><div id="dialog-content"></div><button id="close">閉じる</button></dialog><script type="module" src="./app.js"></script></body></html>
