<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102038"><title>漢鳴 — 群雄の志</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><div><span class="eyebrow">中原六城 ― 人を得て、国を治む</span><h1>漢鳴<span>群雄の志</span></h1></div><div class="seal">漢土<br>太平</div></header>
<section class="statusbar" aria-label="勢力情報"><strong>劉備軍 <span>徐州・小沛より天下へ</span></strong><div id="date"></div><div id="power"></div></section>
<section id="battle-panel" class="panel" hidden aria-label="戦術合戦"><div class="panel-title"><h2 id="battle-title"></h2><span id="battle-meta"></span></div><div id="defense-choice"></div><p class="hint" id="battle-hint"></p><div class="battle-scroll"><svg id="battle-map" viewBox="0 0 800 420" aria-label="六角マスの戦場"></svg></div><div id="battle-actions" class="button-row"></div><div id="battle-detail" class="hint"></div></section>
<div class="layout" id="strategy"><section class="map-panel panel"><div class="panel-title"><h2>中原形勢図</h2><span>架空の六城シナリオ ／ 都市を選択</span></div><div class="map-wrap"><svg id="map" viewBox="0 0 800 500" role="group" aria-label="都市選択地図"></svg><div class="compass">北<br>↑</div><div class="sea">東<br>海</div></div><div class="legend"><span><i class="own"></i>劉備領</span><span><i class="enemy"></i>他勢力</span><span><i class="active"></i>選択中</span><span>街道で隣接都市へ</span></div><div class="map-note">まずは「内政」で担当と予算を指定。「人事」で人材を集め、「軍備」で出陣。命令は武将ごとに月1回。</div></section>
<aside class="panel"><div class="panel-title"><h2>都市情報</h2><span id="ownership"></span></div><div class="city-banner"><span>城 池 台 帳</span><b>漢</b></div><div class="province-head"><span id="clan"></span><h3 id="province"></h3></div><dl id="stats"></dl><div class="section-label">在 城 武 将 <span>統率 ／ 武力 ／ 知力 ／ 政治</span></div><div id="officers" aria-label="在城武将"></div><div class="executor"><label for="executor">命令を実行する武将</label><select id="executor"></select><p id="executor-info"></p></div></aside></div>
<section class="panel command-panel"><nav class="tabs" aria-label="命令カテゴリ"><button data-tab="domestic">内政</button><button data-tab="personnel">人事</button><button data-tab="military">軍備</button><button data-tab="diplomacy">外交・情報</button><button data-tab="report">月次報告</button></nav><div id="command-content"></div></section>
<section class="advisor"><span class="portrait portrait-0" aria-hidden="true"></span><div><span class="advisor-title">主君への奏上</span><p id="advisor-line" aria-live="polite"></p></div><span class="advisor-seal">軍議</span></section>
<section class="bottom"><div class="panel chronicle"><div class="panel-title"><h2>乱世年代記</h2><span>政と戦の記録</span></div><ol id="log"></ol></div><div class="controls"><button id="next" class="primary">翌月へ <span>→</span></button><p>内政と税収を精算し、敵勢力が行動します</p><div class="utility"><button id="save">記録する</button><button id="load">記録を読む</button><button id="help">取扱説明書</button><button id="reset">初めから</button></div><p id="notice" role="status" aria-live="polite"></p></div></section>
<footer><span>漢鳴　群雄の志 ／ 独自制作の三国志戦略譚</span><a href="./manual.html" target="_blank" rel="noopener">取扱説明書を別画面で開く ↗</a></footer></main>
<dialog id="dialog"><div id="dialog-content"></div><button id="close">閉じる</button></dialog><script type="module" src="./app.js"></script></body></html>
