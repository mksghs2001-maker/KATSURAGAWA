<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11171b"><title>漢鳴 — 群雄の志</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><div><span class="eyebrow">興平元年 ― 群雄割拠</span><h1>漢鳴<span>群雄の志</span></h1></div><div class="seal">漢土<br>太平</div></header>
<section class="statusbar" aria-label="勢力情報"><strong>劉備軍 <span>徐州より天下へ</span></strong><div id="date"></div><div id="power"></div></section>
<div class="layout"><section class="map-panel panel"><div class="panel-title"><h2>天下形勢図</h2><span>輿地全図　／　都市を選択</span></div><div class="map-wrap"><svg id="map" viewBox="0 0 800 500" role="group" aria-label="都市選択地図"></svg><div class="compass">北<br>↑<br>＋</div><div class="sea">東<br>海</div><div class="map-caption">漢 室 衰 微　群 雄 並 立</div></div><div class="legend"><span><i class="own"></i>劉備領</span><span><i class="enemy"></i>他勢力</span><span><i class="active"></i>選択中</span><span>街道で隣接都市へ</span></div></section>
<aside class="panel"><div class="panel-title"><h2>都市情報</h2><span id="ownership"></span></div><div class="city-banner"><span>城 池 台 帳</span><b>漢</b></div><div class="province-head"><span id="clan"></span><h3 id="province"></h3></div><dl id="stats"></dl><div class="section-label">在 城 武 将 <span>武力 ／ 知力 ／ 政治</span></div><div id="officers" aria-label="在城武将"></div><div class="orders"><h4>評議 ― 本季の命令 <span id="ap"></span></h4><button data-action="farm"><span>一　開墾</span><small>金30 ／ 政治力で効果上昇</small></button><button data-action="recruit"><span>二　徴兵</span><small>金40・糧20 ／ 兵＋30</small></button><button data-action="train"><span>三　調練</span><small>金20 ／ 士気＋15</small></button><button data-action="search"><span>四　武将登用</span><small>金40 ／ 在野から登用</small></button><button data-action="move"><span>五　武将赴任</span><small>別の自都市へ移動</small></button><button data-action="buy"><span>六　米購入</span><small>金40 → 糧60</small></button><button data-action="give"><span>七　施し</span><small>糧30 ／ 士気＋20</small></button><button data-action="tax"><span>八　税率</span><small id="tax">40％ ⇄ 60％</small></button><button id="attack"><span>九　出陣</span><small>隣接都市へ ／ 兵40・糧50</small></button></div></aside></div>
<section class="advisor"><span class="portrait portrait-0" aria-hidden="true"></span><div><span class="advisor-title">主君への奏上</span><p id="advisor-line" aria-live="polite"></p></div><span class="advisor-seal">軍議</span></section><section class="bottom"><div class="panel chronicle"><div class="panel-title"><h2>乱世年代記</h2><span>政と戦の記録</span></div><ol id="log" aria-live="polite"></ol></div><div class="controls"><button id="next" class="primary">次の季節へ <span>→</span></button><p>季節ごとに命令3回・秋に収穫</p><div class="utility"><button id="save">記録する</button><button id="load">記録を読む</button><button id="help">遊び方</button><button id="reset">初めから</button></div><p id="notice" role="status"></p></div></section>
<footer><span>漢鳴　群雄の志　／　独自制作の三国志戦略譚</span><span>一都市から、漢土統一へ。</span></footer></main>
<dialog id="dialog"><div id="dialog-content"></div><button id="close">閉じる</button></dialog><script type="module" src="./app.js"></script></body></html>
